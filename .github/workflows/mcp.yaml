name: MCP typecheck and test

# The AL-Go workflows build the AL apps but never touch the Bun/TypeScript MCP server in mcp/.
# This job typechecks it AND runs its test suite (mcp/test — real server construction over the SDK's
# in-memory transport with a stubbed fetch), so neither an SDK-breaking change nor a behavioral
# regression can ship silently. A failing assertion fails the job; typecheck alone never caught those.
# skills/wicket-usage is watched too: the suite byte-compares it with the bundled mcp/skill copy.
# plugin/ is watched because the suite checks its skill copy, launchers and source hash.
# It runs on Windows and macOS as well as Linux, plus an end-to-end smoke test on Windows and macOS.

on:
  workflow_dispatch:
  push:
    paths:
      - 'mcp/**'
      - 'skills/wicket-usage/**'
      - 'plugin/**'
      - '.github/workflows/mcp.yaml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'skills/wicket-usage/**'
      - 'plugin/**'
      - '.github/workflows/mcp.yaml'

permissions:
  contents: read

jobs:
  verify:
    # The client is for Windows and Apple-silicon Macs; Linux stays as the quick baseline.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13   # the version the suite was recorded green on locally
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/launcher/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: go test ./...
        working-directory: mcp/launcher

  smoke:
    # The real thing on each client platform: launcher download and start by the extensionless
    # command, the compiled server, the token cache (DPAPI / Keychain), the secret page and store.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/launcher/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run scripts/smoke.ts
